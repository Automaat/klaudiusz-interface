version: "2"

linters:
  enable:
    # Core (enabled by default, explicitly listed)
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Security & Correctness
    - gosec
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # Nil Safety & Pointer Issues
    - nilnesserr

    # Dependency Management
    - forbidigo

    # Code Quality
    - gocyclo
    - goconst
    - unconvert
    - dupl
    - gocognit
    - nestif
    - cyclop

    # Best Practices
    - gocritic
    - revive
    - prealloc
    - predeclared
    - thelper
    - tparallel
    - nolintlint

    # Completeness Checks
    - exhaustive
    - gochecksumtype

    # Documentation
    - misspell
    - godox

    # Formatting & Style
    - whitespace

    # Performance
    - goprintffuncname

    # Bugs & Correctness
    - nilerr
    - nilnil
    - noctx
    - contextcheck
    - errname
    - forcetypeassert
    - makezero
    - nakedret
    - promlinter
    - asasalint
    - bidichk
    - copyloopvar
    - dupword
    - durationcheck
    - ginkgolinter
    - intrange
    - loggercheck
    - mirror
    - mnd
    - musttag
    - nosprintfhostport
    - perfsprint
    - reassign
    - sloglint
    - tagalign
    - unparam
    - usestdlibvars
    - wastedassign
    - modernize
    - err113
    - funlen
    - containedctx
    - errchkjson
    - gocheckcompilerdirectives
    - ireturn
    - wsl_v5

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - cyclop
          - errcheck
          - dupl
          - gosec
          - funlen
          - goconst
          - nestif
          - bodyclose
          - noctx
          - thelper
          - tparallel
          - forcetypeassert
          - wrapcheck
          - mnd
          - unparam
          - wastedassign
          - ginkgolinter
          - godox
          - exhaustive

      - path: '_test\.go'
        text: "should not use dot imports"

      - path: internal/testing\.go
        linters:
          - errcheck
          - gosec
          - forcetypeassert

settings:
  cyclop:
    max-complexity: 30

  funlen:
    lines: 100
    statements: 50

  gocognit:
    min-complexity: 20

  gocyclo:
    min-complexity: 30

  goconst:
    min-len: 2
    min-occurrences: 3

  dupl:
    threshold: 100

  godox:
    keywords:
      - FIXME
      - HACK
      - XXX

  exhaustive:
    default-signifies-exhaustive: true

  govet:
    enable-all: true
    disable:
      - fieldalignment

  staticcheck:
    checks: ["all"]

  revive:
    enable-all-rules: false
    severity: warning
    rules:
      - name: blank-imports
      - name: context-keys-type
      - name: time-equal
      - name: time-naming
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-declaration
      - name: unused-parameter
      - name: unreachable-code
      - name: unused-receiver
      - name: early-return
      - name: modifies-parameter
      - name: confusing-naming
      - name: duplicated-imports

      - name: package-comments
        disabled: true
      - name: exported
        disabled: true
      - name: var-naming
        disabled: true
      - name: indent-error-flow
        disabled: true
      - name: context-as-argument
        disabled: true

  nakedret:
    max-func-lines: 30

  nestif:
    min-complexity: 5

  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true

  errcheck:
    check-type-assertions: true
    check-blank: false

  wsl_v5:
    allow-first-in-block: true
    allow-whole-block: false
    branch-max-lines: 2

  forbidigo:
    forbid:
      - pattern: 'fmt\.Errorf'
        msg: "use errors.New, errors.Wrap, or errors.Wrapf"
    analyze-types: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/Automaat/klaudiusz-brain

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Automaat/klaudiusz-brain)

issues:
  max-same-issues: 50
