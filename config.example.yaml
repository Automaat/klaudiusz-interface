# klaudiusz-interface configuration
#
# Place this file in one of:
# - ./config.yaml (current directory)
# - ~/.klaudiusz/config.yaml (user config)
# - /etc/klaudiusz/config.yaml (system config)
#
# Or specify via --config flag

# HTTP server configuration
server:
  port: "8742"                  # HTTP listen port
  read_timeout: 15s             # Request read timeout
  write_timeout: 15s            # Response write timeout
  idle_timeout: 60s             # Keep-alive idle timeout
  shutdown_timeout: 10s         # Graceful shutdown timeout

# Claude CLI configuration
claude:
  path: /path/to/claude  # Path to claude binary (e.g., ~/.local/bin/claude)
  # IMPORTANT: Must point to klaudiusz-brain repo root directory
  # The klaudiusz-brain repo contains CLAUDE.md with system prompt that defines:
  # - Language preference (Polish responses for Home Assistant TTS)
  # - Voice-friendly response format (no symbols/brackets for Piper TTS)
  # - Home Assistant context and guidelines
  # - Security/privacy constraints
  # - Domain-specific instructions for smart home queries
  #
  # Setup:
  # 1. Clone klaudiusz-brain: git clone https://github.com/yourorg/klaudiusz-brain.git
  # 2. Point working_dir to the repo root (supports relative/absolute/~ paths)
  # 3. Claude Code CLI will auto-read klaudiusz-brain/CLAUDE.md on each query
  working_dir: ../klaudiusz-brain
  execution_timeout: 2m         # Max time for claude command
  max_prompt_length: 100000     # Max prompt characters

# Session management
session:
  timeout: 5m                   # Session expiry timeout
  cleanup_interval: 1m          # Background cleanup interval

# Telegram bot integration
telegram:
  enabled: false                # Enable Telegram bot
  bot_token: ""                 # Bot token (keep in secure config.yaml with 0600 permissions)
  group_session_mode: per_user  # Session mode: per_user or per_group

  # Voice message handling
  voice:
    enabled: true               # Process voice messages
    max_file_size: 20971520     # Max voice file size (20MB)
    download_timeout: 30s       # Voice download timeout

  # Photo message handling
  photo:
    enabled: true               # Process photo messages
    max_file_size: 20971520     # Max photo file size (20MB)
    download_timeout: 30s       # Photo download timeout

# Deepgram speech-to-text
deepgram:
  api_key: ""                   # API key (keep in secure config.yaml with 0600 permissions)
  language: pl                  # Recognition language (pl, en, etc.)
  model: nova-3                 # Model name

# Conversation memory
memory:
  enabled: true                 # Enable memory extraction
  db_path: ~/.klaudiusz/memory.db  # SQLite database path

  # Background fact extraction
  extraction:
    interval: 10m               # Background extraction interval
    timeout: 2m                 # Extraction command timeout
    max_conversations: 20       # Max conversations to extract per run
    fact_limit: 10              # Max facts to inject into prompts
    admin_timeout: 2m           # Admin endpoint extraction timeout

# Scheduled tasks
scheduler:
  enabled: false                # Enable scheduled tasks

  # Example tasks (remove or customize as needed)
  tasks:
    # Execute a Claude skill on schedule
    - name: daily_commit
      interval: 24h             # Run every 24 hours
      type: skill               # Task type: "skill" or "command"
      command: commit           # Skill name (without /)
      args: ""                  # Optional skill arguments
      working_dir: ~/sideprojects/my-project  # Override claude.working_dir
      timeout: 5m               # Task execution timeout (max 10m)
      skip_permissions: false   # Skip permission checks (use with caution)
      enabled: true             # Can disable without removing

    # Execute a Claude command on schedule
    - name: periodic_cleanup
      interval: 1h              # Run every hour (min 1m)
      type: command             # Execute as direct command
      command: "clean up old log files"  # Command text
      args: ""                  # Not used for commands
      working_dir: ""           # Uses claude.working_dir if empty
      timeout: 30s              # Task timeout
      skip_permissions: false   # Skip permission checks (use with caution)
      enabled: false            # Disabled by default

# Security notes:
# - Set file permissions to 0600 (read/write owner only): chmod 0600 config.yaml
# - Add config.yaml to .gitignore to avoid committing secrets
# - All secrets (bot tokens, API keys) must be in config.yaml

# Hot reload:
# - Most settings reload automatically on file save
# - Port and bot token require server restart
# - Watch logs for "Config reloaded successfully" message
